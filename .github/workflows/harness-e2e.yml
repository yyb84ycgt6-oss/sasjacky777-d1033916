name: Agent harnesses (e2e)

# Hermes Agent and DeepSeek Harness driving the app through its MCP server,
# against a local copy of the backend: the real migrations under PostgREST,
# the real built MCP function and jackie-bionic under Deno. See
# harness/e2e/run.sh for what it proves and what it cannot.
#
# Its own workflow, and only when something an agent touches changes, because
# it installs two third-party agent frameworks: a failure here should name
# itself rather than turn the main CI red with someone else's release.

on:
  push:
    branches: ["SAS-JACKY"]
    paths:
      - "harness/**"
      - "src/lib/mcp/**"
      - "src/lib/appActions.ts"
      - "supabase/functions/mcp/**"
      - "supabase/functions/jackie-bionic/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"
      - ".github/workflows/harness-e2e.yml"
  pull_request:
    paths:
      - "harness/**"
      - "src/lib/mcp/**"
      - "src/lib/appActions.ts"
      - "supabase/functions/mcp/**"
      - "supabase/functions/jackie-bionic/**"
      - "supabase/functions/_shared/**"
      - "supabase/migrations/**"
      - ".github/workflows/harness-e2e.yml"
  workflow_dispatch:

concurrency:
  group: harness-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions this was verified against. Bump deliberately, one at a time.
  HERMES_REF: d3b25b52ad1318c526bdb259b600eeca3d5f38e6 # Hermes Agent v0.21.4
  DSH_VERSION: 0.1.5-rc.2
  POSTGREST_VERSION: v12.2.3

jobs:
  e2e:
    name: Hermes Agent + DeepSeek Harness → MCP → app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mcp-check.mjs uses the MCP SDK the app already depends on.
      - name: Install app dependencies
        run: npm ci

      - name: PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgvector
          # The run connects as postgres and PostgREST as authenticator, both
          # over the local socket, so local connections are trusted here.
          sudo sed -i -E 's/\b(peer|scram-sha-256|md5)\b/trust/g' /etc/postgresql/16/main/pg_hba.conf
          sudo sed -i -E "s/^#?port = .*/port = 5433/" /etc/postgresql/16/main/postgresql.conf
          sudo pg_ctlcluster 16 main restart || sudo pg_ctlcluster 16 main start

      - name: PostgREST
        run: |
          curl -sSL -o /tmp/postgrest.tar.xz \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          tar -xf /tmp/postgrest.tar.xz -C /tmp
          /tmp/postgrest --version

      # The [mcp] extra is what gives Hermes its HTTP MCP client; without it
      # Hermes cannot reach a URL-based server at all (docs/HARNESSES.md).
      - name: Hermes Agent
        run: |
          python -m venv /tmp/hermes
          /tmp/hermes/bin/pip install --quiet "hermes-agent[mcp] @ git+https://github.com/NousResearch/hermes-agent@${HERMES_REF}"
          /tmp/hermes/bin/hermes --version

      - name: DeepSeek Harness
        run: |
          mkdir -p /tmp/dsh && cd /tmp/dsh && npm init -y >/dev/null
          npm install --no-audit --no-fund "@deepseek-ai/dsh@${DSH_VERSION}"

      - name: End to end
        env:
          PGHOST: /var/run/postgresql
          PGPORT: "5433"
          PGUSER: postgres
          POSTGREST_BIN: /tmp/postgrest
          HERMES_BIN: /tmp/hermes/bin/hermes
          DSH_BIN: /tmp/dsh/node_modules/.bin/dsh
          E2E_DIR: /tmp/e2e
        run: DENO_BIN="$(command -v deno)" bash harness/e2e/run.sh

      - name: Logs
        if: failure()
        run: |
          for f in /tmp/e2e/logs/*; do echo "::group::$f"; tail -n 80 "$f"; echo "::endgroup::"; done
