# Put the guidance model's weights in the repo, from a machine that has git-lfs
# and a network — which is what a GitHub runner is.
#
# The repo knows which model it wants: `prism-ml/Bonsai-1.7B-gguf`, pinned in
# scripts/guidance-weights-source.mjs. So this needs no input at all in the
# normal case:
#
#   Actions → Add guidance weights → Run workflow
#
# The download, the checks and the choice of quantisation are all done by
# `npm run weights`, the same command a person runs on their own machine. This
# file arranges a runner around it and opens a pull request; it does not have
# its own opinion about any of it, because a second copy of that logic is a
# second thing to keep right.
#
# Nothing runs on a schedule — a gigabyte of download and the LFS quota it
# spends happen when a person asks for them.
name: Add guidance weights

on:
  workflow_dispatch:
    inputs:
      quant:
        description: "Quantisation to take, e.g. q4_k_m. Leave empty for the best available."
        required: false
        type: string
      url:
        description: "Override: fetch from this URL instead of the pinned repository. Must serve the file itself."
        required: false
        type: string
      sha256:
        description: "Expected SHA-256. Recommended with --url, since nothing else then checks you got the file you meant."
        required: false
        type: string
      branch:
        description: "Branch to commit the weights to"
        required: false
        default: add-guidance-weights
        type: string

# The workflow writes a branch and opens a PR. It never pushes to the default
# branch: a gigabyte of binary is worth one human look first.
permissions:
  contents: write
  pull-requests: write

jobs:
  add-weights:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Use the repository's node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and verify the weights
        env:
          QUANT: ${{ inputs.quant }}
          URL: ${{ inputs.url }}
          SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          # `if` rather than `[ -n "$X" ] && args+=(…)`: under `set -e` a failed
          # test as the last command of a list exits the step, so the empty
          # case — which is the normal one, the whole point of pinning the
          # source — would abort before downloading anything.
          args=()
          if [ -n "$QUANT" ];  then args+=(--quant  "$QUANT");  fi
          if [ -n "$URL" ];    then args+=(--url    "$URL");    fi
          if [ -n "$SHA256" ]; then args+=(--sha256 "$SHA256"); fi

          # The script refuses anything that is not a real GGUF of a plausible
          # size, and updates the size the app advertises to match what it
          # actually got. Both matter here: a runner committing 250 MB of HTML
          # error page through LFS is expensive to undo.
          node scripts/fetch-guidance-weights.mjs ${args[@]+"${args[@]}"}

      - name: Measure what arrived
        id: weights
        run: |
          set -euo pipefail
          path=public/models/bonsai-1.7b/bonsai-1.7b.gguf
          bytes=$(stat -c%s "$path")
          # Rounded, not truncated, because this is the same file the script
          # rounds when it writes sizeMB. Shell integer division reported 236
          # for the 237 the registry had just been given — two numbers for one
          # file, which is the whole thing this change exists to stop.
          echo "mb=$(( (bytes + 512 * 1024) / 1024 / 1024 ))" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Commit it through Git LFS
        env:
          BRANCH: ${{ inputs.branch }}
          SIZE_MB: ${{ steps.weights.outputs.mb }}
          SHA: ${{ steps.weights.outputs.sha }}
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          # .gitattributes already tracks public/models/**/*.gguf. Verify rather
          # than assume: a plain blob this size is refused at push time with an
          # error that does not name the cause.
          if ! git check-attr filter -- public/models/bonsai-1.7b/bonsai-1.7b.gguf | grep -q "filter: lfs"; then
            echo "::error::The .gguf is not covered by an LFS filter — check .gitattributes."
            exit 1
          fi

          # The registry too: the fetch script rewrites sizeMB to the size of
          # the file it actually got, and committing the weights without that
          # leaves the app advertising a number for a different build.
          git add public/models/bonsai-1.7b/bonsai-1.7b.gguf src/lib/microai/models.ts
          git commit -m "Add the Bonsai 1.7B guidance weights (${SIZE_MB} MB, via Git LFS)

          Fetched from the pinned source, prism-ml/Bonsai-1.7B-gguf, by
          \`npm run weights\` on a runner. Verified: GGUF magic bytes, a size
          large enough to be the real model, and the SHA-256 if one was given.

          sha256 ${SHA}

          The Guide answers from the route manifest with or without this file.
          With it installed — ollama create bonsai-1.7b -f
          public/models/bonsai-1.7b/Modelfile — it answers in sentences."

          git push --set-upstream origin "$BRANCH"

      # The weights are already pushed by the time this runs. Many repositories
      # forbid Actions from opening pull requests (Settings → Actions → "Allow
      # GitHub Actions to create and approve pull requests"), and this one does
      # — so `gh pr create` failed and painted the whole run red over work that
      # had entirely succeeded. A red run over a delivered branch teaches people
      # to ignore red runs. The PR is a convenience; the branch is the product.
      - name: Open a pull request
        id: pr
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          SIZE_MB: ${{ steps.weights.outputs.mb }}
          SHA: ${{ steps.weights.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Add the Bonsai 1.7B guidance weights (${SIZE_MB} MB)" \
            --body "$(cat <<EOF
          The guidance model's weights, fetched and verified on a runner by \`npm run weights\`.

          - **Source:** \`prism-ml/Bonsai-1.7B-gguf\`, pinned in \`scripts/guidance-weights-source.mjs\`
          - **Size:** ${SIZE_MB} MB, stored as a Git LFS object
          - **sha256:** \`${SHA}\`
          - **Checked:** GGUF magic bytes, a size large enough to be the real model, SHA-256 if one was supplied

          \`sizeMB\` in \`src/lib/microai/models.ts\` is updated in the same commit, so the
          Model Bay budget, the station probe and the Guide panel describe the file that
          is actually on disk.

          Merging this makes \`/guide\` report the weights present. To have the Guide
          answer in sentences rather than from the route manifest alone, build the
          model once on the machine that runs the app:

          \`\`\`sh
          ollama create bonsai-1.7b -f public/models/bonsai-1.7b/Modelfile
          \`\`\`

          Anyone cloning after this merges needs \`git lfs install\` and \`git lfs pull\`
          to get the real file; without it they get a pointer, and the Guide panel
          says so rather than claiming the model is installed.
          EOF
          )"

      - name: Say what happened
        env:
          BRANCH: ${{ inputs.branch }}
          SIZE_MB: ${{ steps.weights.outputs.mb }}
          SHA: ${{ steps.weights.outputs.sha }}
          PR: ${{ steps.pr.outcome }}
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          {
            echo "### Guidance weights installed"
            echo
            echo "- **Source:** \`prism-ml/Bonsai-1.7B-gguf\`"
            echo "- **Size:** ${SIZE_MB} MB, as a Git LFS object"
            echo "- **sha256:** \`${SHA}\`"
            echo "- **Branch:** [\`${BRANCH}\`](${repo}/tree/${BRANCH})"
            echo
            if [ "$PR" = "success" ]; then
              echo "A pull request was opened."
            else
              echo "This repository does not let Actions open pull requests, so"
              echo "the branch is pushed and waiting: [open the PR yourself](${repo}/compare/${{ github.event.repository.default_branch }}...${BRANCH}?expand=1)."
              echo
              echo "To let it do this itself: Settings → Actions → General → Workflow permissions →"
              echo "\"Allow GitHub Actions to create and approve pull requests\"."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
