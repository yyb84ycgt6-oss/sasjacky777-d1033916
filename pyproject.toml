[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jackierouter"
version = "0.2.0"
description = "Predictive, hardware-aware, cost-tiered AI routing with context-preserving failover"
readme = "jackierouter/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "routing", "rate-limit", "failover", "ollama", "openai", "anthropic", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["jackierouter"]

[project.scripts]
jackierouter = "jackierouter.__main__:main"

[tool.pytest.ini_options]
# The command_station suite drives the real HybridRouter, so it runs here too.
testpaths = ["tests", "command_station/tools"]
