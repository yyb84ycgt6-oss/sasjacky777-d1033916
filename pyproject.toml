[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jackierouter"
version = "0.1.0"
description = "Predictive, cost-tiered AI routing with context-preserving failover"
readme = "jackierouter/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "routing", "rate-limit", "failover", "ollama", "openai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["jackierouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
